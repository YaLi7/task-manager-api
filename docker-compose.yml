services:
  task-manager-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-manager-api:v1
    container_name: task-manager-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
